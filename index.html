<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>For you</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
}

#stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #000;
  touch-action: manipulation;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* Textura retro subtil */
#texture {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,.2) 4px
  );
  transition: opacity .4s;
}

#stage.active #texture {
  opacity: .55;
}

#cta {
  position: absolute;
  left: 50%;
  bottom: max(10%, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  border: 1px solid rgba(255,255,255,.5);
  padding: 16px 26px;
  border-radius: 3px;
  background: rgba(0,0,0,.55);
  color: white;
  font: 700 clamp(24px, 7vw, 42px)/1.1 Arial, sans-serif;
  white-space: nowrap;
  cursor: pointer;
  box-shadow: 4px 4px 0 rgba(255,50,100,.4);
  animation: breathe 1.5s ease-in-out infinite;
}

#cta[hidden] {
  display: none;
}

@keyframes breathe {
  50% {
    filter: brightness(1.35);
    box-shadow: 6px 6px 0 rgba(255,50,100,.65);
  }
}

#message {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding:
    max(24px, env(safe-area-inset-top))
    max(22px, env(safe-area-inset-right))
    max(24px, env(safe-area-inset-bottom))
    max(22px, env(safe-area-inset-left));
  pointer-events: none;
  opacity: 0;
  transform: scale(.9);
  transition: opacity .8s ease, transform 1s ease;
}

#message.visible {
  opacity: 1;
  transform: scale(1);
}

#words {
  width: 100%;
  margin: 0;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 900;
  line-height: 1.02;
  letter-spacing: -.055em;
  text-align: center;
  overflow-wrap: normal;
  text-shadow:
    2px 0 rgba(255,40,100,.6),
    -2px 0 rgba(80,180,255,.3);
}

#words span {
  color: #ff426b;
}
</style>
</head>

<body>
<main id="stage" aria-label="Animação de um coração">
  <canvas id="canvas" aria-hidden="true"></canvas>
  <div id="texture"></div>

  <button id="cta" type="button" hidden>Clica aqui</button>

  <div id="message">
    <p id="words">
      This may be Digital,<br>
      but my love my love<br>
      for you is <span>real</span>
    </p>
  </div>
</main>

<script>
(() => {
  "use strict";

  const stage = document.getElementById("stage");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const cta = document.getElementById("cta");
  const message = document.getElementById("message");
  const words = document.getElementById("words");

  let W = 1, H = 1, dpr = 1;
  let state = "black";
  let started = 0;
  let exploded = 0;
  let lastFrame = 0;

  let pieces = [];
  let smoke = [];
  let sparks = [];
  let dust = [];
  let heartSize = 1;
  let heartX = 0, heartY = 0;

  const random = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = t => 1 - Math.pow(1 - t, 4);

  function fitText() {
    const style = getComputedStyle(message);
    const width = message.clientWidth
      - parseFloat(style.paddingLeft)
      - parseFloat(style.paddingRight);
    const height = message.clientHeight
      - parseFloat(style.paddingTop)
      - parseFloat(style.paddingBottom);

    let low = 8;
    let high = Math.min(width * .2, 170);

    for (let i = 0; i < 12; i++) {
      const size = (low + high) / 2;
      words.style.fontSize = size + "px";

      if (words.scrollHeight <= height * .9 &&
          words.scrollWidth <= width + 1) {
        low = size;
      } else {
        high = size;
      }
    }

    words.style.fontSize = low + "px";
  }

  function resize() {
    W = stage.clientWidth;
    H = stage.clientHeight;
    dpr = Math.min(devicePixelRatio || 1, 2);

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    heartSize = Math.min(W * .84, H * .57, 560);
    heartX = W / 2;
    heartY = H * .43;

    fitText();
  }

  window.addEventListener("resize", resize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resize);
  }
  resize();

  /*
    Coordenadas normalizadas:
    o contorno forma um coração e cada célula interior
    é dividida em fragmentos triangulares diferentes.
  */
  const outline = [
    [0, -.28],
    [-.15, -.43],
    [-.32, -.44],
    [-.47, -.29],
    [-.49, -.09],
    [-.38, .10],
    [0, .48],
    [.38, .10],
    [.49, -.09],
    [.47, -.29],
    [.32, -.44],
    [.15, -.43]
  ];

  function insideHeart(x, y) {
    let inside = false;

    for (let i = 0, j = outline.length - 1;
         i < outline.length; j = i++) {
      const [xi, yi] = outline[i];
      const [xj, yj] = outline[j];

      if (((yi > y) !== (yj > y)) &&
          x < (xj - xi) * (y - yi) / (yj - yi) + xi) {
        inside = !inside;
      }
    }

    return inside;
  }

  // Découpe chaque triangle aux limites du cœur.
  function clipPolygon(poly) {
    let result = poly;

    // Deux moitiés convexes pour respecter le creux du cœur.
    return result;
  }

  function buildPieces() {
    pieces = [];

    const n = 12;
    const grid = [];

    for (let row = 0; row <= n; row++) {
      grid[row] = [];
      for (let col = 0; col <= n; col++) {
        grid[row][col] = {
          x: -.51 + col * 1.02 / n + random(-.014, .014),
          y: -.47 + row * 1.02 / n + random(-.014, .014)
        };
      }
    }

    function add(poly) {
      const x = poly.reduce((sum, p) => sum + p.x, 0) / poly.length;
      const y = poly.reduce((sum, p) => sum + p.y, 0) / poly.length;

      if (!insideHeart(x, y)) return;

      const angle = random(0, Math.PI * 2);
      const distance = random(1.1, 2);

      pieces.push({
        x, y,
        vertices: poly.map(p => ({x: p.x - x, y: p.y - y})),
        startX: Math.cos(angle) * distance,
        startY: Math.sin(angle) * distance,
        delay: random(0, 1.7),
        rotation: random(-5, 5),
        hue: random(340, 365),
        light: random(39, 66),
        vx: 0, vy: 0,
        spin: random(-9, 9),
        ex: 0, ey: 0,
        er: 0
      });
    }

    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        const a = grid[r][c];
        const b = grid[r][c + 1];
        const d = grid[r + 1][c];
        const e = grid[r + 1][c + 1];

        if (Math.random() > .5) {
          add([a, b, e]);
          add([a, e, d]);
        } else {
          add([a, b, d]);
          add([b, e, d]);
        }
      }
    }
  }

  function traceHeart() {
    ctx.beginPath();
    outline.forEach(([x, y], i) => {
      const px = heartX + x * heartSize;
      const py = heartY + y * heartSize;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.closePath();
  }

  function drawPiece(piece, x, y, rotation, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(rotation);

    ctx.beginPath();
    piece.vertices.forEach((v, i) => {
      const px = v.x * heartSize * .94;
      const py = v.y * heartSize * .94;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.closePath();

    const gradient = ctx.createLinearGradient(-15, -20, 20, 25);
    gradient.addColorStop(0,
      `hsl(${piece.hue}, 95%, ${piece.light + 12}%)`);
    gradient.addColorStop(.5,
      `hsl(${piece.hue}, 88%, ${piece.light}%)`);
    gradient.addColorStop(1,
      `hsl(${piece.hue}, 88%, ${piece.light - 20}%)`);

    ctx.fillStyle = gradient;
    ctx.fill();

    ctx.strokeStyle = "rgba(255,190,210,.45)";
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  function startBuilding() {
    buildPieces();
    started = performance.now();
    state = "building";
    stage.classList.add("active");
  }

  function explode() {
    if (state !== "ready") return;

    cta.hidden = true;
    state = "exploding";
    exploded = performance.now();

    pieces.forEach(p => {
      const angle = Math.atan2(p.y, p.x) + random(-.55, .55);
      const speed = random(.45, 1.65);
      p.vx = Math.cos(angle) * speed;
      p.vy = Math.sin(angle) * speed - .25;
    });

    smoke = Array.from({length: 42}, () => {
      const angle = random(0, Math.PI * 2);
      const speed = random(.08, .45);

      return {
        x: heartX + random(-20, 20),
        y: heartY + random(-20, 20),
        vx: Math.cos(angle) * speed * heartSize,
        vy: Math.sin(angle) * speed * heartSize - 30,
        radius: random(12, 35),
        life: random(1.5, 3),
        maxLife: 3,
        shade: Math.random() > .6 ? "130,45,65" : "95,90,105"
      };
    });

    sparks = Array.from({length: 100}, () => {
      const angle = random(0, Math.PI * 2);
      const speed = random(90, 650);

      return {
        x: heartX, y: heartY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: random(.4, 1.4),
        size: random(1, 3)
      };
    });

    dust = Array.from({length: 60}, () => ({
      x: heartX, y: heartY,
      vx: random(-180, 180),
      vy: random(-180, 100),
      life: random(1, 3),
      size: random(1, 3)
    }));
  }

  function reset() {
    state = "black";
    cta.hidden = true;
    message.classList.remove("visible");
    stage.classList.remove("active");
    pieces = [];
    smoke = [];
    sparks = [];
    dust = [];
  }

  cta.addEventListener("click", event => {
    event.stopPropagation();
    explode();
  });

  stage.addEventListener("click", () => {
    if (state === "black") startBuilding();
    else if (state === "message") reset();
  });

  function drawSmoke(dt) {
    for (const p of smoke) {
      p.life -= dt;
      if (p.life <= 0) continue;

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.exp(-1.1 * dt);
      p.vy -= 10 * dt;
      p.radius += 35 * dt;

      const opacity = Math.min(.28, p.life * .19);
      const g = ctx.createRadialGradient(
        p.x, p.y, 0, p.x, p.y, p.radius
      );

      g.addColorStop(0, `rgba(${p.shade},${opacity})`);
      g.addColorStop(.55, `rgba(${p.shade},${opacity * .5})`);
      g.addColorStop(1, `rgba(${p.shade},0)`);

      ctx.fillStyle = g;
      ctx.fillRect(
        p.x - p.radius, p.y - p.radius,
        p.radius * 2, p.radius * 2
      );
    }
  }

  function drawSparks(dt) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";

    for (const p of sparks) {
      p.life -= dt;
      if (p.life <= 0) continue;

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 190 * dt;
      p.vx *= Math.exp(-.8 * dt);

      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.strokeStyle = "#ffbd9c";
      ctx.lineWidth = p.size;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * .025, p.y - p.vy * .025);
      ctx.stroke();
    }

    ctx.restore();

    for (const p of dust) {
      p.life -= dt;
      if (p.life <= 0) continue;

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 22 * dt;

      ctx.fillStyle = `rgba(255,85,125,${Math.min(.7, p.life)})`;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
  }

  function frame(now) {
    const dt = Math.min((now - lastFrame) / 1000 || .016, .035);
    lastFrame = now;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    if (state === "building" || state === "ready") {
      const elapsed = (now - started) / 1000;

      const glow = ctx.createRadialGradient(
        heartX, heartY, 0,
        heartX, heartY, heartSize * .7
      );
      glow.addColorStop(0, "rgba(150,0,45,.18)");
      glow.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);

      /*
        Peças em movimento ficam livres.
        Ao assentarem, são recortadas pelo contorno.
      */
      for (const p of pieces) {
        const progress = clamp((elapsed - p.delay) / 1.25, 0, 1);
        if (progress === 0) continue;

        const e = ease(progress);
        const x = heartX + (p.x + p.startX * (1 - e)) * heartSize;
        const y = heartY + (p.y + p.startY * (1 - e)) * heartSize;

        ctx.save();

        if (progress === 1) {
          traceHeart();
          ctx.clip();
        }

        drawPiece(p, x, y, p.rotation * (1 - e), Math.min(1, progress * 4));
        ctx.restore();
      }

      if (state === "building" && elapsed > 3.05) {
        state = "ready";
        cta.hidden = false;
      }
    }

    if (state === "exploding" || state === "message") {
      const elapsed = (now - exploded) / 1000;
      const shake = Math.max(0, 1 - elapsed / .5) * 12;

      ctx.save();
      ctx.translate(random(-shake, shake), random(-shake, shake));

      drawSmoke(dt);

      if (elapsed < 2.5) {
        for (const p of pieces) {
          p.ex += p.vx * dt;
          p.ey += p.vy * dt;
          p.vy += .85 * dt;
          p.er += p.spin * dt;

          drawPiece(
            p,
            heartX + (p.x + p.ex) * heartSize,
            heartY + (p.y + p.ey) * heartSize,
            p.er,
            clamp(1 - elapsed / 2.5, 0, 1)
          );
        }
      }

      drawSparks(dt);

      // Onda de choque
      if (elapsed < .8) {
        ctx.strokeStyle = `rgba(255,150,185,${(1 - elapsed / .8) * .8})`;
        ctx.lineWidth = 1 + (1 - elapsed / .8) * 5;
        ctx.beginPath();
        ctx.arc(heartX, heartY, elapsed * Math.max(W, H), 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();

      // Flash inicial breve
      if (elapsed < .16) {
        ctx.fillStyle = `rgba(255,210,225,${(1 - elapsed / .16) * .65})`;
        ctx.fillRect(0, 0, W, H);
      }

      if (elapsed > 1.05 && !message.classList.contains("visible")) {
        fitText();
        message.classList.add("visible");
      }

      // Só permite reiniciar depois de a frase estar visível.
      if (elapsed > 2.1) {
        state = "message";
      }
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
